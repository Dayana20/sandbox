[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live Dropbox tests are left out of a plain `pytest`.
# Run them with: pytest tests/integration
addopts = ["--ignore=tests/integration"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pyflakes and the basic pycodestyle error checks only.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["app"]

# The Dropbox SDK ships without type information.
[[tool.mypy.overrides]]
module = ["dropbox", "dropbox.*"]
ignore_missing_imports = true
