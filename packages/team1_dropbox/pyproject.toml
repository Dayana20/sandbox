[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team1-dropbox-storage"
version = "0.1.0"
description = "Team 1 Dropbox implementation of the shared DocumentStorage contract"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Team 1" }]
dependencies = [
    "cloud-storage-api @ git+https://github.com/Dayana20/ospsd26-cloud-storage.git@0.3.1#subdirectory=src/cloud_storage_api",
    "dropbox==12.1.0",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
    "build>=1.2,<2",
    "mypy>=1.14,<3",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
team1_dropbox = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires explicit credentials for a disposable Dropbox account",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/team1_dropbox"]

[[tool.mypy.overrides]]
module = ["dropbox", "dropbox.*"]
ignore_missing_imports = true
